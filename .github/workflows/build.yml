name: 打包 exe

on:
  push:
  workflow_dispatch:
    inputs:
      release_version:
        description: "要发布的版本号（比如 v0.1.0），留空则只打包不发布"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 打包成单个 exe
        run: >
          dotnet publish src/PiggyHelper/PiggyHelper.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: 启动测试并截图
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $cases = @(
            @{ name = "1-home";      args = @("--page", "home") },
            @{ name = "2-navigator"; args = @("--page", "navigator") },
            @{ name = "3-search";    args = @("--page", "navigator", "--query", "怎么调声音") },
            @{ name = "4-cleanup";   args = @("--page", "cleanup", "--auto", "scan", "--delay", "15") },
            @{ name = "5-bigfiles";  args = @("--page", "cleanup", "--auto", "big", "--delay", "10") },
            @{ name = "6-shortcuts"; args = @("--page", "shortcuts") },
            @{ name = "7-overlay";   args = @("--page", "overlay") },
            @{ name = "8-ai-setup";  args = @("--page", "ai", "--auto", "setup") },
            @{ name = "9-ai-chat";   args = @("--page", "ai", "--auto", "demo") },
            @{ name = "10-settings"; args = @("--page", "settings") },
            @{ name = "11-cmap";     args = @("--page", "cleanup", "--auto", "map", "--delay", "45") },
            @{ name = "12-cmap-cards"; args = @("--page", "cleanup", "--auto", "map2", "--delay", "8") }
          )
          $failed = $false
          foreach ($c in $cases) {
            $out = Join-Path $PWD "screenshots/$($c.name).png"
            $p = Start-Process publish/PiggyHelper.exe -ArgumentList ($c.args + @("--screenshot", "`"$out`"")) -PassThru
            $null = $p.Handle  # 保证之后能读到退出码
            if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "$($c.name): 超时"; $failed = $true; continue }
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) {
              Write-Host "$($c.name): 失败，退出码 $($p.ExitCode)"
              if (Test-Path "$out.error.txt") { Get-Content "$out.error.txt" }
              $failed = $true
            } else { Write-Host "$($c.name): OK" }
          }
          if ($failed) { exit 1 }

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: PiggyHelper-exe
          path: publish/PiggyHelper.exe

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: 截图存到 ci-screenshots 分支（方便查看）
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots/*.png)) { exit 0 }
          Set-Location screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "界面截图：${{ github.ref_name }} @ ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: 准备发布文件
        if: inputs.release_version != ''
        shell: pwsh
        run: |
          $v = "${{ inputs.release_version }}"
          Copy-Item publish/PiggyHelper.exe "PiggyHelper-$v.exe"
          Compress-Archive -Path "PiggyHelper-$v.exe" -DestinationPath "PiggyHelper-$v.zip"

      - name: 上传到 GitHub Release
        if: inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: 小猪电脑助手 ${{ inputs.release_version }}
          body: |
            下载 PiggyHelper-${{ inputs.release_version }}.exe，双击就能运行，不用安装。
            如果浏览器拦截 exe 下载，可以改下 zip 压缩包，解压后再双击运行。
            第一次运行如果 Windows 提示"已保护你的电脑"，点"更多信息"→"仍要运行"。
          files: |
            PiggyHelper-${{ inputs.release_version }}.exe
            PiggyHelper-${{ inputs.release_version }}.zip
